[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aswarm"
version = "0.1.0"
description = "Behavioral Contextual Decoy Matrix & Autonomous Response Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR ZeroHack-Commercial" }
authors = [{ name = "ZeroHack.org", email = "solutions@zerohack.org" }]
keywords = ["honeynet", "security", "decoy", "ai-malware", "EDR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://zerohack.org"
Documentation = "https://zerohack.org/docs/aegisswarm"
Repository = "https://github.com/ZeroHackOrg/aegisswarm"

[project.scripts]
aswarm = "aegisswarm.cli.controls:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegisswarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"